syntax = "proto3";

package product;

service ProductService{
  rpc GetProductById (GetProductByIdRequest) returns (ProductResponse);
  rpc GetAllProducts (Empty) returns (ProductsResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductResponse);
  rpc DeleteProduct (GetProductByIdRequest) returns (Empty);
}

message Empty{

}

message GetProductByIdRequest {
  string id = 1;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  double price = 3;
  string description = 4;
  int32 stockQuantity = 5;
  bool isActive = 6;
}

message ProductsResponse {
  repeated ProductResponse products = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  string description = 3;
  int32 stockQuantity = 4;
}

message UpdateProductRequest {
  string id = 1;
  string name = 2;
  double price = 3;
  string description = 4;
  int32 stockQuantity = 5;
  bool isActive = 6;
}
