syntax = "proto3";

package auth;

service AuthService{
  rpc AuthenticateUser (AuthRequest) returns (AuthResponse);
  rpc ValidateToken(TokenRequest) returns (TokenResponse);
}

message AuthRequest{
  string email = 1;
  string password = 2;
}

message AuthResponse{
  bool success = 1;
  string token = 2;
  string error = 3;
}

message TokenRequest{
  string token = 1;
}

message TokenResponse{
  bool valid = 1;
  string userId = 2;
  string error = 3;
}